name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # qa-inspect-host is a native renderer binary. Its currently published
    # Linux runtime predates Tauri's GTK trait additions, while macOS is the
    # supported build used by the host's own CI and by AgencyZero.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout rsbuild-plugin-ui-css-purge
        uses: actions/checkout@v4
        with:
          repository: pathscale/rsbuild-plugin-ui-css-purge
          path: rsbuild-plugin-ui-css-purge

      - name: Symlink plugin to expected path
        run: ln -s $GITHUB_WORKSPACE/rsbuild-plugin-ui-css-purge ../rsbuild-plugin-ui-css-purge

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Track the current ps-qa release so UI coverage cannot silently remain
      # on an obsolete harness. Do not inherit a tool crate's packaged lockfile.
      - name: Install native QA tools
        env:
          # cargo install otherwise builds in disposable temporary directories,
          # which leaves rust-cache nothing useful to restore on the next run.
          CARGO_TARGET_DIR: target/qa-tools
        run: |
          cargo install ps-qa qa-inspect-host

      - name: Install Dependencies
        run: bun install

      # `qa` only, for now: `src` carries 20 pre-existing findings that are not
      # this change's to fix, and gating on them would block every PR. The
      # harness itself was unlinted, and a duplicate JSX prop in it made all 71
      # component pages render an empty box, which is the rule Biome catches.
      - name: Lint
        run: bun run qa:lint

      - name: Contract Check
        run: bun run check

      - name: Type Check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      # Native renderer outcomes replace jsdom interaction tests as the release
      # gate. One headless host per component keeps the complete sweep below two
      # minutes while preserving a clean document between components.
      - name: Rendered component outcomes
        env:
          # GitHub's shared macOS runner took 1.6-1.9s for outcomes that pass
          # locally under 1.25s. This widens scheduling deadlines only; every
          # declared rendered-state transition is still required.
          QA_TIMEOUT_SCALE: 2
        run: |
          bun run qa:checks
          bun run qa:entries
          git diff --exit-code -- tests/ps-qa tests/qa-harness/entries
          bun run qa:build
          zsh tests/qa-harness/run-all.sh

      # Fails when docs/api-contract.md and the shipped types disagree, in
      # either direction. Never runs with --write: regenerating the document on
      # every build is what made the last one unable to disagree with the code.
      - name: API Contract
        run: bun run check:api

      # Packs the tarball, installs it into a fresh consumer and builds against
      # it. The only step that tests the artifact a consumer receives, and the
      # one that catches a package dist imports but the manifest does not
      # declare.
      - name: Consumer Smoke
        run: bun run smoke

      # The same gate the release job runs, moved forward to where it is cheap
      # to fail. It lived only in Release, so a README documenting a subpath
      # that no longer shipped passed every check here and stopped the 2.6.0
      # publish instead. npm forbids replacing a version, so a release that
      # fails this late costs a version number rather than a re-run.
      - name: Package Check
        run: bun run check:package
