name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # Linux, since `qa-inspect-host` 0.1.9. It could not be built here before:
    # it reached the engine through `tauri-runtime-blitz`, which brought the
    # Tauri runtime with it, and that does not compile on Linux at all -- its
    # `RawWindow` is a `gtk::ApplicationWindow` there and a Blitz window has
    # none. So this job ran on macOS to get a host at all.
    #
    # The host opens no window, and now does not compile one: it takes the
    # runtime with `default-features = false`, so nothing in its graph is Tauri
    # or GTK. macOS is for building packages, not for a component sweep.
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Checkout rsbuild-plugin-ui-css-purge
        uses: actions/checkout@v4
        with:
          repository: pathscale/rsbuild-plugin-ui-css-purge
          path: rsbuild-plugin-ui-css-purge

      - name: Symlink plugin to expected path
        run: ln -s $GITHUB_WORKSPACE/rsbuild-plugin-ui-css-purge ../rsbuild-plugin-ui-css-purge

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # A UI assertion failing after native tool installation must not make
          # the next corrective run rebuild the observability stack from zero.
          cache-on-failure: true

      # The host is the browser, and the browser is not a crate a site can
      # install: `chuzz-headless` is built from source by the composite action
      # below, which also installs the driver. That replaced `qa-inspect-host`,
      # which was a second headless browser with the web platform in only the
      # other one -- no `URLSearchParams`, no `matchMedia`, no storage, no
      # observers -- so every gap closed for the browser had to be closed a
      # second time there by hand, or the sweep measured a browser nobody
      # ships.
      #
      # 0.1.12 is still on crates.io, so nothing broke when the crate was
      # deleted from source; this is the last consumer to move off it.
      - name: Headless browser host
        id: qa
        uses: pathscale/chuzz/.github/actions/headless-host@master
        with:
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}

      - name: Install Dependencies
        run: bun install

      # `qa` only, for now: `src` carries 20 pre-existing findings that are not
      # this change's to fix, and gating on them would block every PR. The
      # harness itself was unlinted, and a duplicate JSX prop in it made all 71
      # component pages render an empty box, which is the rule Biome catches.
      - name: Lint
        run: bun run qa:lint

      - name: Contract Check
        run: bun run check

      - name: Type Check
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

      # Native renderer outcomes replace jsdom interaction tests as the release
      # gate. One headless host per component preserves a clean document.
      - name: Rendered component outcomes
        env:
          # A shared runner takes longer than a local machine for outcomes that pass
          # locally well inside the budget. This widens scheduling deadlines only; every
          # declared rendered-state transition is still required.
          QA_TIMEOUT_SCALE: 2
          # The shared host action installs fonts without a desktop stack.
          # Keep actual paint assertions in the release gate.
          QA_PROFILE: full
          # The harness looks for `chuzz-headless` on PATH; here it is the
          # build the composite action above just made, so it is named
          # outright.
          QA_HOST: ${{ steps.qa.outputs.host }}
        run: |
          bun run qa:checks
          bun run qa:entries
          git diff --exit-code -- tests/ps-qa tests/ps-qa-headless tests/qa-harness/entries
          bun run qa:build
          bash tests/qa-harness/run-all.sh

      # Fails when docs/api-contract.md and the shipped types disagree, in
      # either direction. Never runs with --write: regenerating the document on
      # every build is what made the last one unable to disagree with the code.
      - name: API Contract
        run: bun run check:api

      # Packs the tarball, installs it into a fresh consumer and builds against
      # it. The only step that tests the artifact a consumer receives, and the
      # one that catches a package dist imports but the manifest does not
      # declare.
      - name: Consumer Smoke
        run: bun run smoke

      # The same gate the release job runs, moved forward to where it is cheap
      # to fail. It lived only in Release, so a README documenting a subpath
      # that no longer shipped passed every check here and stopped the 2.6.0
      # publish instead. npm forbids replacing a version, so a release that
      # fails this late costs a version number rather than a re-run.
      - name: Package Check
        run: bun run check:package
