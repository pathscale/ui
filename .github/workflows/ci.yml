name: CI

on:
  workflow_dispatch:

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    # The headless browser archive is built for Linux x86_64.
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Bun
        shell: bash
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/bun-1.4.4.XXXXXX")"
          archive=bun-linux-x64-baseline.zip
          sha256=e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/$archive" \
            --output "$directory/$archive"
          printf '%s  %s\n' "$sha256" "$directory/$archive" | sha256sum --strict --check
          unzip -q "$directory/$archive" bun-linux-x64-baseline/bun -d "$directory"
          chmod +x "$directory/bun-linux-x64-baseline/bun"
          echo "$directory/bun-linux-x64-baseline" >> "$GITHUB_PATH"

      - name: Set up Rust for ps-qa
        shell: bash
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          rustup default 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A UI assertion failing after native tool installation must not make
          # the next corrective run rebuild the observability stack from zero.
          cache-on-failure: true
          cache-bin: false

      # Match the driver's debug protocol 2 descriptor and socket.
      - name: Headless browser host
        id: qa
        shell: bash
        run: |
          version=0.1.46
          asset=chuzz-headless-x86_64-unknown-linux-gnu.tar.gz
          sha256=a43bbba7b1336c19db0eb7e892df2771ba87986aca06478343ff1eaddc8eb21d
          directory="$RUNNER_TEMP/chuzz-headless-$version"
          mkdir -p "$directory"
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "https://github.com/pathscale/chuzz/releases/download/headless-v$version/$asset" \
            --output "$directory/$asset"
          printf '%s  %s\n' "$sha256" "$asset" | (cd "$directory" && sha256sum --strict --check)
          tar -xzf "$directory/$asset" -C "$directory"
          test "$(cat "$directory/VERSION")" = "$version"
          chmod +x "$directory/chuzz-headless"
          echo "host=$directory/chuzz-headless" >> "$GITHUB_OUTPUT"

      - name: Install fonts for rendered outcomes
        run: |
          snapshot=20261107T000000Z
          sudo apt-get --snapshot "$snapshot" -o APT::Update::Error-Mode=any update
          sudo apt-get --snapshot "$snapshot" install -y fontconfig fonts-dejavu-core

      - name: Install the headless QA driver
        run: cargo install ps-qa --locked --version '=0.9.8'

      - name: Install Dependencies
        run: bun install --no-save

      # `qa` only, for now: `src` carries 20 pre-existing findings that are not
      # this change's to fix, and gating on them would block every PR. The
      # harness itself was unlinted, and a duplicate JSX prop in it made all 71
      # component pages render an empty box, which is the rule Biome catches.
      - name: Lint
        run: bun run qa:lint

      - name: Contract Check
        run: bun run --bun check

      - name: Type Check
        run: bun check --no-script

      - name: Build
        run: bun run --bun build

      # Native renderer outcomes replace jsdom interaction tests as the release
      # gate. One headless host per component preserves a clean document.
      - name: Rendered component outcomes
        env:
          # A shared runner takes longer than a local machine for outcomes that pass
          # locally well inside the budget. This widens scheduling deadlines only; every
          # declared rendered-state transition is still required.
          QA_TIMEOUT_SCALE: 2
          # The runner has fonts without a desktop stack.
          # Keep actual paint assertions in the release gate.
          QA_PROFILE: full
          # Use the verified browser archive from the host step.
          QA_HOST: ${{ steps.qa.outputs.host }}
        run: |
          bun run qa:checks
          bun run qa:entries
          git diff --exit-code -- tests/ps-qa tests/ps-qa-headless tests/qa-harness/entries
          bun run --bun qa:build
          bash tests/qa-harness/run-all.sh

      # Fails when docs/api-contract.md and the shipped types disagree, in
      # either direction. Never runs with --write: regenerating the document on
      # every build is what made the last one unable to disagree with the code.
      - name: API Contract
        run: bun run check:api

      # Packs the tarball, installs it into a fresh consumer and builds against
      # it. The only step that tests the artifact a consumer receives, and the
      # one that catches a package dist imports but the manifest does not
      # declare.
      - name: Consumer Smoke
        env:
          SMOKE_WORK_DIR: ${{ runner.temp }}/ui-smoke
        run: |
          mkdir -p "$SMOKE_WORK_DIR"
          bun run smoke

      # Check that the tarball ships the exports and imports documented in the README.
      - name: Package Check
        run: bun run check:package
