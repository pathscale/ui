name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - name: Checkout rsbuild-plugin-ui-css-purge
        uses: actions/checkout@v4
        with:
          repository: pathscale/rsbuild-plugin-ui-css-purge
          path: rsbuild-plugin-ui-css-purge

      - name: Symlink plugin to expected path
        run: ln -s $GITHUB_WORKSPACE/rsbuild-plugin-ui-css-purge ../rsbuild-plugin-ui-css-purge

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      # `qa` only, for now: `src` carries 20 pre-existing findings that are not
      # this change's to fix, and gating on them would block every PR. The
      # harness itself was unlinted, and a duplicate JSX prop in it made all 71
      # component pages render an empty box, which is the rule Biome catches.
      - name: Lint
        run: bun run qa:lint

      - name: Contract Check
        run: bun run check

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build
        run: bun run build

      # `bun run test`, not bare `bun test`: the script passes
      # --conditions=browser, without which Bun resolves Solid's inert server
      # build and every reactive assertion reads back empty.
      - name: Test
        run: bun run test

      # Fails when docs/api-contract.md and the shipped types disagree, in
      # either direction. Never runs with --write: regenerating the document on
      # every build is what made the last one unable to disagree with the code.
      - name: API Contract
        run: bun run check:api

      # Packs the tarball, installs it into a fresh consumer and builds against
      # it. The only step that tests the artifact a consumer receives, and the
      # one that catches a package dist imports but the manifest does not
      # declare.
      - name: Consumer Smoke
        run: bun run smoke

      # The same gate the release job runs, moved forward to where it is cheap
      # to fail. It lived only in Release, so a README documenting a subpath
      # that no longer shipped passed every check here and stopped the 2.6.0
      # publish instead. npm forbids replacing a version, so a release that
      # fails this late costs a version number rather than a re-run.
      - name: Package Check
        run: bun run check:package
