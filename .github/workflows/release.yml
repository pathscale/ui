name: Release

# Fully automatic releases. Push to master, and if the commits since the last
# published version warrant a release, this bumps the version, publishes to npm
# and tags it. No version-bump PR, no manual step.
#
# The version comes from conventional commits (scripts/next-version.ts):
#   type! / BREAKING CHANGE -> major, feat -> minor, fix|perf|revert -> patch.
# Docs- or chore-only pushes release nothing.
#
# Two modes, so a half-finished release always recovers:
#   * package.json's version is NOT on npm  -> publish it as-is (recovery, or a
#     hand-written bump someone committed deliberately)
#   * it IS on npm -> compute the next version, bump, publish, tag
#
# Publishing uses npm Trusted Publishing (OIDC): no NPM_TOKEN exists in this
# repository. Requires one-time setup on npmjs.com:
#   @pathscale/ui -> Settings -> Trusted Publisher -> GitHub Actions
#   repository: pathscale/ui, workflow: release.yml
# Without it the publish step fails closed rather than publishing unauthenticated.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # next-version.ts reads commit history

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Decide whether to release, and as what version
        id: decide
        run: |
          current="$(node -p "require('./package.json').version")"

          if ! npm view "@pathscale/ui@$current" version >/dev/null 2>&1; then
            echo "mode=publish-current" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "::notice::$current is not on npm — publishing it as-is"
            exit 0
          fi

          next="$(bun run scripts/next-version.ts)"
          if [ -z "$next" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::no releasable commits since $current — nothing to do"
            exit 0
          fi

          echo "mode=bump" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "::notice::releasing $current -> $next"

  release:
    needs: decide
    if: needs.decide.outputs.mode != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit, create the tag and release
      id-token: write # OIDC trusted publishing + provenance
    env:
      VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Mirrors ci.yml — the build resolves this plugin from a sibling directory.
      - name: Checkout rsbuild-plugin-ui-css-purge
        uses: actions/checkout@v4
        with:
          repository: pathscale/rsbuild-plugin-ui-css-purge
          path: rsbuild-plugin-ui-css-purge

      - name: Symlink plugin to expected path
        run: ln -s $GITHUB_WORKSPACE/rsbuild-plugin-ui-css-purge ../rsbuild-plugin-ui-css-purge

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # Commit the bump before publishing, so master always states the version we
      # intend to ship. If a later step fails, the next run sees a version that is
      # not on npm and finishes the job via publish-current.
      - name: Bump version on master
        if: needs.decide.outputs.mode == 'bump'
        run: |
          npm version "$VERSION" --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git push origin HEAD:master

      - name: Install dependencies
        run: bun install

      - name: Contract check
        run: bun run check

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: bun run build

      # ---- gates. A version can never be reused, so fail before shipping.

      - name: Package check (exports and README resolve against the tarball)
        run: bun run check:package

      - name: publint (publish config, exports, file paths)
        run: npx --yes publint --strict

      # Advisory, not blocking. The published 1.2.11 fails this identically, so it
      # reports a pre-existing condition rather than a regression, and gating on it
      # would block releases that are strictly better than what is live. The .d.ts
      # internal-resolution problem is real and worth fixing on its own.
      - name: Are the types wrong? (advisory)
        continue-on-error: true
        run: npx --yes @arethetypeswrong/cli --pack --ignore-rules cjs-resolves-to-esm

      - name: Publish to npm
        run: npm publish --provenance --access public

      # Tag only after a successful publish, so tags never point at a version that
      # is not on npm. Tags had drifted badly before this — newest was v1.1.51
      # while npm was on 1.2.11.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes
