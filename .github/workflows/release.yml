name: Release

on:
  workflow_dispatch:
    inputs:
      master_sha:
        description: Full current master SHA after the owner-authorized local QA gate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-master
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.repository == 'pathscale/ui' && github.ref == 'refs/heads/master' && inputs.master_sha == github.sha
    runs-on: ubicloud-standard-2-ubuntu-2404
    outputs:
      sha256: ${{ steps.archive.outputs.sha256 }}
    env:
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify the selected revision is still master
        run: |
          master="$(git ls-remote --exit-code origin refs/heads/master)"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "${master%%$'\t'*}" = "$TARGET_SHA"

      - name: Setup Bun
        run: |
          directory="$(mktemp -d "$RUNNER_TEMP/bun-1.4.4.XXXXXX")"
          archive=bun-linux-x64-baseline.zip
          sha256=e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/$archive" \
            --output "$directory/$archive"
          printf '%s  %s\n' "$sha256" "$directory/$archive" | sha256sum --strict --check
          unzip -q "$directory/$archive" bun-linux-x64-baseline/bun -d "$directory"
          chmod +x "$directory/bun-linux-x64-baseline/bun"
          echo "$directory/bun-linux-x64-baseline" >> "$GITHUB_PATH"

      - name: Check the manifest version on npm
        run: |
          version_path="$(bun -e 'console.log(encodeURIComponent(require("./package.json").version))')"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 "https://registry.npmjs.org/@pathscale%2fui/$version_path")"
          case "$status" in
            404) ;;
            200)
              echo "::error::The package.json version is already published."
              exit 1
              ;;
            *)
              echo "::error::npm version lookup returned HTTP $status."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: bun install --no-save

      # A version can never be reused on npm, so every gate runs before packing.
      - name: Contract check
        run: bun run --bun check

      - name: Type check
        run: bunx tsc --noEmit

      - name: Build the release package
        run: bun run --bun build:dist

      - name: Pack the release archive
        run: |
          git diff --exit-code HEAD -- package.json
          mkdir -p release
          bun pm pack --filename release/package.tgz

      - name: Package check (exports and README resolve against the archive)
        env:
          PACKAGE_TARBALL: release/package.tgz
        run: bun run check:package

      - name: Record the release archive digest
        id: archive
        run: |
          checksum="$(sha256sum release/package.tgz)"
          echo "sha256=${checksum%% *}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: release/package.tgz
          if-no-files-found: error

  # Publishing uses npm Trusted Publishing (OIDC); no registry token is stored.
  # The npmjs.com package settings name this repository and release.yml as the
  # trusted publisher. Without that the publish step fails closed.
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm-publish
    permissions:
      id-token: write # OIDC trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify the archive and master revision
        env:
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.sha256 }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          printf '%s  %s\n' "$ARCHIVE_SHA256" release/package.tgz | sha256sum --strict --check
          master="$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/master)"
          test "${master%%$'\t'*}" = "$TARGET_SHA"

      - name: Require npm with OIDC support
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch = 0] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version" || {
            echo "::error::npm 11.5.1 or newer is required for Trusted Publishing; found $npm_version"
            exit 1
          }

      - name: Publish the verified archive
        run: npm publish ./release/package.tgz --registry https://registry.npmjs.org --access public --ignore-scripts
